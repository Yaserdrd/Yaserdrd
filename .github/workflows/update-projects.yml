name: Refresh latest projects
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_projects.py
      - .github/workflows/update-projects.yml
permissions:
  contents: write
concurrency:
  group: profile-projects
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/update_projects.py
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Save refreshed showcase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/latest-projects.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh latest project showcase'
            git push
          fi
